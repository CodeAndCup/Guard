#
# Sanction name and duration configuration
# Check config.yml for the command execution.
#
# Duration:
# - s = seconds
# - m = minutes
# - h = hours
# - mo = month
# - y = years
# - Perm = permanant (Check config.yml for editing the time of permanant)
#
# Information: You can add color to sanction name.
#
sanction:
  mute:
    spam:
      name: "Spam"
      duration: "15m"
    flood:
      name: "Flood"
      duration: "15m"
    provocation:
      name: "Provocation"
      duration: "30m"
    insult:
      name: "Insult"
      duration: "3h"
    abusive_capital_letter:
      name: "Abusive Capital Letter"
      duration: "15m"
    bad_language:
      name: "Bad Language"
      duration: "30m"
    harassment:
      name: "Harassment"
      duration: "30m"
    defamation:
      name: "Defamation"
      duration: "30m"
    no_respect:
      name: "No respect"
      duration: "40m"
    racism:
      name: "Racism, Xenophobia, Homophobia, etc."
      duration: "4h"
    its:
      name: "Incitement to Suicide"
      duration: "6h"
    advertisement:
      name: "Advertisement"
      duration: "12h"
    doxing:
      name: "Dox Threat"
      duration: "1d"
    ip_leak:
      name: "Leak IP"
      duration: "Perm"
    ItO:
      name: "Incitement to the offense"
      duration: "15m"
    server_bashing:
      name: "Server bashing"
      duration: "1d"
    staff_denigration:
      name: "Staff denigration"
      duration: "1d"
    insolence_staff:
      name: "Insolence Staff"
      duration: "15m"
    provocation_staff:
      name: "Provocation Staff"
      duration: "4h"
    bad_language_staff:
      name: "Bad Language towards Staff"
