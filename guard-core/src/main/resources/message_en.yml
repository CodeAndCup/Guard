#
# Menu message configuration
#
menu:
  comingsoon: "&cComing soon."
  dashboard:
    title: "#0E6F7D&lGuard #fDashboard"
    players:
      name: "#2EE6D6&lPlayers"
      lore:
        - "&fConnected players."
        - "&8> &eClick here."
      title: "#0E6F7D&lConnected players"
    reports:
      name: "#2EE6D6&lReports"
      lore:
        - "&fPending reports."
        - "&8> &eClick here."
    moderation:
      title: "#0E6F7D&lModeration"
