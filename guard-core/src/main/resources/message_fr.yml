#
# Sanction name and duration configuration
# Check config.yml for the command execution.
#
# Duration:
# - s = seconds
# - m = minutes
# - h = hours
# - mo = month
# - y = years
# - Perm = permanant (Check config.yml for editing the time of permanant)
#
# Information: You can add color to sanction name.
#
sanction:
  mute:
    spam:
      name: "Spam"
      duration: "15m"
    flood:
      name: "Flood"
      duration: "15m"
    provocation:
      name: "Provocation"
      duration: "30m"
    insult:
