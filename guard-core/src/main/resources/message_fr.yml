      duration: "30m"
    no_respect:
      name: "Non respect"
      duration: "40m"
    racism:
      name: "Racisme, Xenophobie, Homophobie, etc."
      duration: "4h"
    its:
      name: "Incitation au suicide"
      duration: "6h"
    advertisement:
      name: "Publicité"
      duration: "12h"
    doxing:
      name: "Menace de DOX"
      duration: "1d"
    ip_leak:
      name: "Leak IP"
      duration: "Perm"
    ItO:
