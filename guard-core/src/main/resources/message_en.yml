#▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄
#
# Commands message configuration
#
# Tips:
#   You can add [ACTION] to put the message in the action bar.
#   If you want to put in both (action bar and chat) you can put [CHAT][ACTION]
#   If nothting or just [CHAT] is put this will send the message in the chat.
#
commands:
    staffchat:
      enabled: "&aStaff chat enabled."
      disabled: "&cStaff chat disabled."
      format: "&8[{server_name}] #2EE6D6{staff} &f: {message}"
    report:
      usage: "&c/report #2EE6D6<player> <reason>"
      sent: "&aReport #%id% sent. A moderator will handle it."
      cooldown: "&cWait %seconds% s before another report."
      flash: "#2EE6D6[Report] &f%text%"
      xray-flash: "#2EE6D6[Guard] &f%text%"
      cross-freeze: "#2EE6D6[Guard] &c%text% got frozen on another server."
  freeze:
    missargs: "&c/freeze <player>"
    activated: "#17A1B2%target% was frozen."
    desactivated: "#17A1B2%target% was unfreeze."
    disconnect: "&c%player% disconnected in freeze."
  cps:
    missargs: "&c/cps <player>"
    running: "&fCPS checker apply to #2EE6D6%target%"
    format: "#17A1B2%target% &8> #2EE6D6%left% &f| #2EE6D6%right% &fcps."
    end: "&fAverage #2EE6D6%target% &fcps &8> #2EE6D6%left% &f| #2EE6D6%right% &fcps."
  vanish:
    activated: "[ACTION][CHAT]&fVanish &aactivated"
    desactivated: "[ACTION][CHAT]&fVanish &cdesactivated"
  teleport:
    missargs: "&c/tp <player>"
    confirmation: "&fTeleportation to #17A1B2&l%target%"
  teleporthere:
    missargs: "&c/tph <player>"
    confirmation: "&fTeleportation of #17A1B2&l%target% &fto you."
  sanctionset:
    missargs: "&c/ss <player>"
  noclip:
    activated: "&fNoClip &aactivated"
    desactivated: "&fNoClip &cdesactivated"
  chatcolor:
    activated: "&fChatColor &aactivated"
    desactivated: "&fChatColor &cdesactivated"
    color: "#2EE6D6"
  inventory:
    missargs: "&c/invsee <player>"
  modlist:
    format:
      - "&8&l&m------------------------------"
      - "#0E6F7D&l        Guard ModList"
      - " "
      - "&8- &f%target% %value%"
      - "&8&l&m------------------------------"
  chatlock:
    activated: "&fThe chat has been &clocked&f."
    desactivated: "&fThe chat has been &aunlock&f."
    lock_message: "&cSorry but the chat is currently locked."
  lookup:
    message:
      - "&8&l&m------------------------------"
      - "#0E6F7D&l        Guard LookUP"
      - ""
      - "&fName&8: #2EE6D6%target%"
      - "&fUUID&8: #2EE6D6%uuid%"
      - "&fPremium&8: #2EE6D6%premium%"
      - "&fCreate At&8: #2EE6D6%date%"
      - "&fIP&8: #2EE6D6%ip%"
      - "&fCountry&8: #2EE6D6%country%"
      - "&fISP&8: #2EE6D6%isp%"
      - ""
      - "&8&l&m------------------------------"
#
