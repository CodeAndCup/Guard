#
# Main configuration message
#
prefix: "#0E6F7D&lGuard &8» "
no_perm: "&cYou don't have permission."
playernotfound: "&cPlayer not found."
reloaded: "&aConfiguration have been reloaded successfully"
commanddisable: "&cSorry but this command is disable."
