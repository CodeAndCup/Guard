#
#
# Message Configuration [FR].
# Some place holder are available on specific string.
# - %v% -> ✓
# - %x% -> ✗
# - %target% -> Targeted Player
# - %left% -> Left Click Value
# - %right% -> Right Click Value
# - %type% -> Type of the sanction (Ban / Warn / Mute)
# - %reason% -> Reason of the sanction
# - %duration% -> Duration of the sanction
# - %value% -> For value like (On/Off)
#
#▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄
#
# Main configuration message
#
prefix: "&3&lGuard &8» "
no_perm: "&cVous n'avez pas la permission."
playernotfound: "&cLe joueur n'a pas été trouvé."
reloaded: "&aLa configuration a été rechargée avec succès."
commanddisable: "&cDésolé mais cette command est désactivée."
#
#▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄
#
# Item name configuration
#
items:
  vanish_on: "&a&lVanish %v%"
  vanish_off: "&c&lVanish %x%"
  freeze: "&b&lFreeze"
  cps: "&7&lCPS"
  random_tp: "&6&lRandom TP"
  ss_book: "&c&lSS Book"
  parameters: "&4&lParametres"
  teleporter: "&b&lTeleporteur"
  knockback: "&2&lKnockBack"
  chat_color: "&b&lChatColor"
  no_clip: "&7&lNoClip"
  inventory_view: "&6&lInventory View"
  go_page_1: "&ePage 1 &8&l<"
  go_page_2_from_1: "&8&l> &ePage 2"
  go_page_2_from_3: "&ePage 2 &8&l<"
  go_page_3: "&8&l> &ePage 3"
#
#▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄
#
# Commands message configuration.
#
# Tips:
#   You can add [ACTION] to put the message in the action bar.
#   If you want to put in both (action bar and chat) you can put [CHAT][ACTION]
#   If nothting or just [CHAT] is put this will send the message in the chat.
#
commands:
  freeze:
    missargs: "&c/freeze <player>"
    activated: "&9%target% a été freeze."
    desactivated: "&9%target% a été unfreeze."
    disconnect: "&c%player% a déconnecté en freeze."
  cps:
    missargs: "&c/cps <player>"
    running: "&fCompteur de CPS &aactive &fsur : &b%target%"
    format: "&9%target% &8> &b%left% &f| &b%right% &fcps."
    end: "&fAverage &b%target% &fcps &8> &b%left% &f| &b%right% &fcps."
  vanish:
    activated: "&fVanish &aactivé"
    desactivated: "&fVanish &cdesactivé"
  teleport:
    missargs: "&c/tp <player>"
    confirmation: "&fTeleportation à &9&l%target%"
  teleporthere:
    missargs: "&c/tph <player>"
    confirmation: "&fTeleportation de &9&l%target% &fà vous."
  sanctionset:
    missargs: "&c/ss <player>"
  noclip:
    activated: "&fNoClip &aactivé"
    desactivated: "&fNoClip &cdesactivé"
  chatcolor:
    activated: "&fChatColor &aactivé"
    desactivated: "&fChatColor &cdesactivé"
    color: "&b"
  inventory:
    missargs: "&c/invsee <player>"
  modlist:
    format:
      - "&8&l&m------------------------------"
      - "&3&l        Guard ModList"
      - " "
      - "&8- &f%target% %value%"
      - "&8&l&m------------------------------"
  chatlock:
    activated: "&fVous avez &clock &fle chat."
    desactivated: "&fVous avez &aunlock &fle chat."
    lock_message: "&cDésolé mais le chat est lock."
  lookup:
    message:
      - "&8&l&m------------------------------"
      - "&3&l        Guard LookUP"
      - ""
      - "&fPseudo&8: &b%target%"
      - "&fUUID&8: &b%uuid%"
      - "&fPremium&8: &b%premium%"
      - "&fCrée le&8: &b%date%"
      - "&fIP&8: &b%ip%"
      - "&fCountry&8: &b%country%"
      - "&fISP&8: &b%isp%"
      - ""
      - "&8&l&m------------------------------"
#
#▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄
#
# Menu message configuration
#
menu:
  freeze:
    title: "&3&lFreeze"
    lore:
      - ""
      - "&fVous êtes freeze."
      - "&fVeuillez rejoindre le discord sous peine de ban."
      - ""
      - "&3discord.gg/..."
  sanctionset:
    selector:
      title: "&3Selectionner un joueur"
      player_lore:
        - ""
        - "&8> &eCliquez-ici pour sélectionner ce joueur."
    main:
      title: "&3&lSS &f> &b%target%"
      ban: "&3&lBan &c(MOD Only)"
      ban_lore:
        - ""
        - "&8> &eCliquez pour y accéder."
      warn: "&3&lWarn"
      warn_lore:
        - ""
        - "&8> &eCliquez pour y accéder."
      mute: "&3&lMute"
      mute_lore:
        - ""
        - "&8> &eCliquez pour y accéder."
    mute:
      title: "&3&lMute &f> &b%target%"
      lore:
        - ""
        - "&3Type&f: &b%type%"
        - "&3Raison&f: &b%reason%"
        - "&3Durée&f: &b%duration%"
        - ""
        - "&8> &eCliquez pour y appliquer."
    warn:
      title: "&3&lWarn &f> &b%target%"
      lore:
        - ""
        - "&3Type&f: &b%type%"
        - "&3Raison&f: &b%reason%"
        - "&3Durée&f: &b%duration%"
        - ""
        - "&8> &eCliquez pour y appliquer."
    ban:
      title: "&3&lBan &f> &b%target%"
      lore:
        - ""
        - "&3Type&f: &b%type%"
        - "&3Raison&f: &b%reason%"
        - "&3Durée&f: &b%duration%"
        - ""
        - "&8> &eCliquez pour y appliquer."
  parameters:
    flyspeed:
      title: "&f&lFlySpeed"
      lore:
        - ""
        - "&fFlySpeed: &bx%value%"
        - ""
        - "&8&l> &aClick Gauche pour augementer"
        - "&8&l> &cClick Droit pour baisser"
    godmode:
      title: "&e&lGodMode"
      lore:
        - ""
        - "&fGodMode: %value%"
        - ""
    nightvision:
      title: "&9&lNight Vision"
      lore:
        - ""
        - "&fNight Vision: %value%"
        - ""
  xray:
    title: "&3&lXRay"
    player:
      name: "&c&l%player%"
      lore:
        - ""
        - "&bDiamond&8: &f%diamond% &7(%pourcent_diamond%%)"
        - "&aEmerald&8: &f%emerald% &7(%pourcent_emerald%%)"
        - "&eGold&8: &f%gold% &7(%pourcent_gold%%)"
        - "&7Iron&8: &f%iron% &7(%pourcent_iron%%)"
        - "&cRedstone&8: &f%redstone% &7(%pourcent_redstone%%)"
        - "&9Lapis&8: &f%lapis% &7(%pourcent_lapis%%)"
        - "&8Coal: &f%coal% &7(%pourcent_coal%%)"
        - "&7Stone&8: &f%stone%"
        - ""
        - "&8> &eCliquez pour vous teleporter au joueur."
